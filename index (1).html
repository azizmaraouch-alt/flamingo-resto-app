
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flamingo Resto Café</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f5;
      color: #40252c;
      text-align: center;
    }
    header {
      background: #d94f70;
      color: white;
      padding: 35px 15px;
    }
    h1 { margin: 0; font-size: 2.2rem; }
    main { padding: 35px 20px; }
    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000012;
    }
    button {
      background: #d94f70;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 22px;
      cursor: pointer;
    }
    footer { padding: 20px; color: #75545c; }
  </style>
</head>
<body>
  <header>
    <h1>🦩 Flamingo Resto Café</h1>
    <p>Bienvenue chez nous !</p>
  </header>

  <main>
    <div class="card">
      <h2>Notre restaurant</h2>
      <p>Découvrez notre espace et nos services.</p>
      <p>🍽️ Restaurant · ☕ Café · ❤️ Bienvenue</p>
      <button onclick="alert('Bienvenue chez Flamingo !')">
        Découvrir
      </button>
    </div>
  </main>

  <footer>© 2026 Flamingo Resto Café</footer>
</body>
</html>

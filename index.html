<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#35151f">
  <meta name="description" content="Flamingo Resto Café — Cuisine, convivialité et expériences gourmandes.">
  <title>Flamingo Resto Café</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --raspberry: #b83b63;
      --raspberry-dark: #8c2646;
      --pink-bg: #fceeed;
      --wine: #35151f;
      --gold: #d5ad70;
      --text: #292322;
      --muted: #7d6b70;
      --border: #f3dada;
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100vh; margin: 0; font-family: "Cairo", "DM Sans", sans-serif; background: var(--pink-bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; }

    .app-container {
      display: flex;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      position: relative;
    }

    .app-overlay {
      position: absolute;
      inset: 0;
      background: rgba(53, 21, 31, 0.45);
      z-index: 1;
    }

    /* Sidebar */
    .sidebar {
      width: 140px;
      background: rgba(252, 238, 237, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 10px;
      z-index: 10;
      border-right: 1px solid rgba(255, 255, 255, 0.4);
    }

    .sidebar-logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      padding: 5px;
      background: #ffffff10;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      border-radius: 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-item.active, .nav-item:hover {
      background: #f7dadd;
      color: var(--raspberry-dark);
    }

    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    .sidebar-footer {
      text-align: center;
      font-size: 10px;
      color: var(--raspberry-dark);
      font-weight: 700;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 30px 20px;
      z-index: 5;
    }

    .auth-card {
      background: rgba(255, 245, 245, 0.95);
      backdrop-filter: blur(15px);
      width: min(480px, 95%);
      border-radius: 32px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .card-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 15px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid var(--gold);
      padding: 5px;
    }

    .auth-card h1 {
      color: var(--raspberry);
      font-size: 24px;
      margin: 10px 0;
      font-weight: 700;
      direction: rtl;
    }

    .auth-card p.subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
      direction: rtl;
    }

    /* Forms & Inputs */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
      text-align: right;
      direction: rtl;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--raspberry-dark);
      margin-bottom: 4px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      outline: none;
      background: #ffffff;
      font-size: 13px;
    }

    .btn-action {
      width: 100%;
      padding: 13px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .btn-raspberry { background: var(--raspberry); color: white; }
    .btn-outline-raspberry { background: transparent; border: 1.5px solid var(--raspberry); color: var(--raspberry); }

    .status {
      margin-top: 15px;
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      display: none;
    }
    .status.success { display: block; background: #e9f6ee; color: #1d6340; }
    .status.error { display: block; background: #fff0ed; color: #9a3024; }
    .status.info { display: block; background: #f7f0df; color: #75541f; }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column-reverse; }
      .sidebar {
        width: 100%;
        height: 70px;
        flex-direction: row;
        padding: 0 20px;
        position: fixed;
        bottom: 0;
        left: 0;
      }
      .sidebar-logo, .sidebar-footer { display: none; }
      .sidebar-nav { flex-direction: row; justify-content: space-around; }
      .main-content { padding-bottom: 90px; }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <div class="app-overlay"></div>

    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="./logo.png" alt="Flamingo Resto Café">
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" id="navAuthBtn">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Compte</span>
        </button>
        <button class="nav-item" id="navResBtn">
          <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
          <span>Réservation</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        Mahdia<br>Corniche 1
      </div>
    </aside>

    <main class="main-content">
      <div class="auth-card">
        <img src="./logo.png" alt="Flamingo Resto Café" class="card-logo">

        <!-- SECTION AUTHENTIFICATION -->
        <div id="sectionAuth">
          <h1>عسلامة بيك في Flamingo ♡</h1>
          <p class="subtitle">ادخل لحسابك ولا اعمل حساب جديد باش تكتشف العروض وتحجز طاولتك.</p>

          <!-- CHOIX SANS FORMULAIRE (Vue Initiale) -->
          <div id="authChoice">
            <button class="btn-action btn-raspberry" id="showLoginBtn">ندخل لحسابي ➔</button>
            <button class="btn-action btn-outline-raspberry" id="showSignupBtn">نعمل حساب جديد ➔</button>
          </div>

          <!-- FORMULAIRE DE CONNEXION -->
          <form id="loginForm" class="hidden">
            <div class="form-grid">
              <div class="field">
                <label>البريد الإلكتروني (Email)</label>
                <input id="loginEmail" type="email" required placeholder="exemple@mail.com">
              </div>
              <div class="field">
                <label>كلمة السر (Mot de passe)</label>
                <input id="loginPassword" type="password" required placeholder="••••••••">
              </div>
            </div>
            <button type="submit" class="btn-action btn-raspberry">تسجيل الدخول ➔</button>
            <button type="button" class="btn-action btn-outline-raspberry backToChoice">رجوع</button>
          </form>

          <!-- FORMULAIRE D'INSCRIPTION -->
          <form id="signupForm" class="hidden">
            <div class="form-grid">
              <div class="field">
                <label>الاسم الكامل</label>
                <input id="signupName" type="text" required placeholder="اسمك ولقبك">
              </div>
              <div class="field">
                <label>رقم الهاتف</label>
                <input id="signupPhone" type="tel" required placeholder="20000000">
              </div>
              <div class="field">
                <label>البريد الإلكتروني</label>
                <input id="signupEmail" type="email" required placeholder="exemple@mail.com">
              </div>
              <div class="field">
                <label>كلمة السر (6 أحرف على الأقل)</label>
                <input id="signupPassword" type="password" minlength="6" required placeholder="••••••••">
              </div>
            </div>
            <button type="submit" class="btn-action btn-raspberry">إنشاء الحساب ➔</button>
            <button type="button" class="btn-action btn-outline-raspberry backToChoice">رجوع</button>
          </form>

          <!-- TABLEAU DE BORD CONNECTÉ -->
          <div id="userProfile" class="hidden">
            <h2 id="welcomeText" style="color:var(--raspberry);">مرحبا بيك!</h2>
            <p id="userEmail" style="font-size:13px; color:var(--muted);"></p>
            <p id="userPoints" style="font-weight:bold; color:var(--gold); font-size:16px;"></p>
            <button class="btn-action btn-outline-raspberry" id="logoutBtn">تسجيل الخروج</button>
          </div>

          <div id="authStatus" class="status"></div>
        </div>

        <!-- SECTION RÉSERVATION -->
        <div id="sectionRes" class="hidden">
          <h1>حجز طاولة ♡</h1>
          <p class="subtitle">عمر المعطيات باش تبعث طلب الحجز بتاعك.</p>

          <form id="reservationForm">
            <div class="form-grid">
              <div class="field">
                <label>الاسم الكامل</label>
                <input id="resName" type="text" required>
              </div>
              <div class="field">
                <label>رقم الهاتف</label>
                <input id="resPhone" type="tel" required>
              </div>
              <div class="field">
                <label>التاريخ</label>
                <input id="resDate" type="date" required>
              </div>
              <div class="field">
                <label>الوقت</label>
                <input id="resTime" type="time" required>
              </div>
              <div class="field">
                <label>عدد الأشخاص</label>
                <select id="resGuests">
                  <option value="1">شخص واحد</option>
                  <option value="2" selected>شخصين</option>
                  <option value="3">3 أشخاص</option>
                  <option value="4">4 أشخاص</option>
                  <option value="5">5 أشخاص أو أكثر</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn-action btn-raspberry">تأكيد طلب الحجز ➔</button>
          </form>
          <div id="resStatus" class="status"></div>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://dnbcanwxikpysscslotn.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7jY0-exkRXZ4SqdFrSxPnQ_86QgmRfT';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const $ = (id) => document.getElementById(id);

    function showStatus(el, msg, type) {
      el.textContent = msg;
      el.className = `status ${type}`;
    }

    // Gestion de l'affichage
    $('showLoginBtn').addEventListener('click', () => {
      $('authChoice').classList.add('hidden');$('loginForm').classList.remove('hidden');
    });

    $('showSignupBtn').addEventListener('click', () => {
      $('authChoice').classList.add('hidden');$('signupForm').classList.remove('hidden');
    });

    document.querySelectorAll('.backToChoice').forEach(btn => {
      btn.addEventListener('click', () => {
        $('loginForm').classList.add('hidden');$('signupForm').classList.add('hidden');
        $('authChoice').classList.remove('hidden');$('authStatus').className = 'status';
      });
    });

    // Navigation Sidebar
    $('navAuthBtn').addEventListener('click', () => {
      $('sectionAuth').classList.remove('hidden');$('sectionRes').classList.add('hidden');
      $('navAuthBtn').classList.add('active');$('navResBtn').classList.remove('active');
    });

    $('navResBtn').addEventListener('click', () => {
      $('sectionRes').classList.remove('hidden');$('sectionAuth').classList.add('hidden');
      $('navResBtn').classList.add('active');$('navAuthBtn').classList.remove('active');
    });

    // Supabase : Connexion
    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showStatus($('authStatus'), 'جاري تسجيل الدخول...', 'info');

      const { data, error } = await supabase.auth.signInWithPassword({
        email: $('loginEmail').value,
        password: $('loginPassword').value
      });

      if (error) {
        showStatus($('authStatus'), 'البريد الإلكتروني أو كلمة السر خاطئة', 'error');
      } else {
        showStatus($('authStatus'), 'تم تسجيل الدخول بنجاح!', 'success');
        checkUser();
      }
    });

    // Supabase : Inscription
    $('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showStatus($('authStatus'), 'جاري إنشاء الحساب...', 'info');

      const { data, error } = await supabase.auth.signUp({
        email: $('signupEmail').value,
        password: $('signupPassword').value,
        options: {
          data: {
            full_name: $('signupName').value,
            phone: $('signupPhone').value
          }
        }
      });

      if (error) {
        showStatus($('authStatus'), error.message, 'error');
      } else {
        showStatus($('authStatus'), 'تم إنشاء الحساب بنجاح!', 'success');
        checkUser();
      }
    });

    // Déconnexion
    $('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      checkUser();
    });

    // Réservation
    $('reservationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = (await supabase.auth.getUser()).data.user;

      if (!user) {
        showStatus($('resStatus'), 'يجب عليك تسجيل الدخول أولاً للقيام بالحجز', 'error');
        return;
      }

      showStatus($('resStatus'), 'جاري إرسال طلب الحجز...', 'info');

      const { error } = await supabase.from('reservations').insert([{
        user_id: user.id,
        full_name: $('resName').value,
        phone: $('resPhone').value,
        reservation_date: $('resDate').value,
        reservation_time: $('resTime').value,
        guests: parseInt($('resGuests').value),
        status: 'pending'
      }]);

      if (error) {
        showStatus($('resStatus'), error.message, 'error');
      } else {
        showStatus($('resStatus'), 'تم إرسال طلب الحجز بنجاح! سنتصل بك للتأكيد.', 'success');
        $('reservationForm').reset();
      }
    });

    // Vérifier l'état de l'utilisateur connecté
    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();

      if (user) {
        $('authChoice').classList.add('hidden');$('loginForm').classList.add('hidden');
        $('signupForm').classList.add('hidden');$('userProfile').classList.remove('hidden');

        $('welcomeText').textContent = `مرحبا بيك ${user.user_metadata?.full_name || ''}`;
        $('userEmail').textContent = user.email;
        $('userPoints').textContent = `نقاط الوفاء: 0`;

        $('resName').value = user.user_metadata?.full_name \vert{}\vert{} '';$('resPhone').value = user.user_metadata?.phone || '';
      } else {
        $('userProfile').classList.add('hidden');$('authChoice').classList.remove('hidden');
      }
    }

    checkUser();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#35151f">
  <meta name="description" content="Flamingo Resto Café — Cuisine, convivialité et expériences gourmandes.">
  <title>Flamingo Resto Café</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --raspberry: #b83b63;
      --raspberry-dark: #8c2646;
      --pink-bg: #fceeed;
      --wine: #35151f;
      --gold: #d5ad70;
      --text: #292322;
      --muted: #7d6b70;
      --border: #f3dada;
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: "Cairo", "DM Sans", sans-serif; background: var(--pink-bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; }

    /* App Layout */
    .app-container {
      display: flex;
      min-height: 100vh;
      /* Image Placeholder lil background - badelha baad b 'background.jpg' */
      background: url('https://via.placeholder.com/1920x1080/fceeed/b83b63?text=Flamingo+Background') center/cover no-repeat fixed;
      position: relative;
    }

    .app-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.15);
      z-index: 1;
    }

    /* Sidebar Gauche */
    .sidebar {
      width: 140px;
      background: rgba(252, 238, 237, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 10px;
      z-index: 10;
      border-right: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Logo Flamingo el 7amra f taswira el sghira mta3 el sidebar */
    .sidebar-logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      padding: 5px;
      background: #ffffff10;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      border-radius: 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-item.active, .nav-item:hover {
      background: #f7dadd;
      color: var(--raspberry-dark);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .sidebar-footer {
      text-align: center;
      font-size: 10px;
      color: var(--raspberry-dark);
      font-weight: 700;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 5;
    }

    /* Floating Card Center */
    .auth-card {
      background: rgba(255, 245, 245, 0.92);
      backdrop-filter: blur(15px);
      width: min(440px, 92%);
      border-radius: 32px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* Logo Flamingo fil card f nafs el style mta3 tsawerk */
    .card-logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid var(--gold);
      padding: 10px;
      background: #ffffff10;
    }

    .auth-card h1 {
      font-family: 'Cairo', sans-serif;
      color: var(--raspberry);
      font-size: 26px;
      margin: 10px 0;
      font-weight: 700;
      direction: rtl;
    }

    .auth-card p.subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 30px;
      direction: rtl;
    }

    /* Form & Buttons */
    .btn-action {
      width: 100%;
      padding: 14px 20px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      transition: transform 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
    }

    .btn-raspberry {
      background: var(--raspberry);
      color: white;
      box-shadow: 0 8px 20px rgba(184, 59, 99, 0.3);
    }

    .btn-outline-raspberry {
      background: transparent;
      border: 1.5px solid var(--raspberry);
      color: var(--raspberry);
    }

    .forgot-link {
      display: inline-block;
      margin-top: 15px;
      color: var(--raspberry);
      font-size: 12px;
      text-decoration: underline;
      direction: rtl;
    }

    /* Mobile Responsive Header */
    @media (max-width: 768px) {
      .app-container { flex-direction: column-reverse; }
      .sidebar {
        width: 100%;
        height: 70px;
        flex-direction: row;
        padding: 0 20px;
        position: fixed;
        bottom: 0;
        left: 0;
        border-right: none;
        border-top: 1px solid rgba(255,255,255,0.4);
      }
      .sidebar-logo, .sidebar-footer { display: none; }
      .sidebar-nav { flex-direction: row; justify-content: space-around; gap: 0; }
      .main-content { padding-bottom: 90px; }
      
      .auth-card { padding: 30px 20px; border-radius: 24px; }
      .card-logo { width: 100px; height: 100px; margin-bottom: 15px; }
      .auth-card h1 { font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <div class="app-overlay"></div>

    <!-- Sidebar Gauche (Navigation) -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <!-- Logo Flamingo el 7amra sghira fil navbar[cite: 1] -->
        <img src="./logo.png" alt="Flamingo Resto Café">
      </div>

      <nav class="sidebar-nav">
        <a href="#accueil" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Accueil</span>
        </a>
        <a href="#menu" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.91 3.45 4.38l-.95 7.62H7.52l.95-7.62C10.46 12.91 11.92 11.12 11.92 9V2h-2v7zM16 2v18h2V12h3V2h-5z"/></svg>
          <span>Menu</span>
        </a>
        <a href="#reservation" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
          <span>Réservation</span>
        </a>
        <a href="#compte" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Compte</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        Mahdia<br>Corniche 1
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="auth-card">
        <!-- Logo Flamingo el kbira fil card fil wost[cite: 1, 4] -->
        <img src="./logo.png" alt="Flamingo Resto Café" class="card-logo">
        
        <h1>عسلامة بيك في Flamingo ♡</h1>
        <p class="subtitle">ادخل لحسابك ولا اعمل حساب جديد<br>باش تكتشف العروض وتحجز طاولتك.</p>

        <button class="btn-action btn-raspberry" id="loginBtn">
          <span>ندخل لحسابي</span>
          <span>➔</span>
        </button>

        <button class="btn-action btn-outline-raspberry" id="signupBtn">
          <span>نعمل حساب جديد</span>
          <span>➔</span>
        </button>

        <a href="#" class="forgot-link">نسيت كلمة السر ؟</a>
      </div>
    </main>
  </div>

    document.getElementById('signupBtn').addEventListener('click', () => {

  </script>
</body>
</html>

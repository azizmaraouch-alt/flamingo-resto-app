<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#35151f">
  <meta name="description" content="Flamingo Resto Café — Cuisine, convivialité et expériences gourmandes.">
  <title>Flamingo Resto Café</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --raspberry: #b83b63;
      --raspberry-dark: #8c2646;
      --pink-bg: #fceeed;
      --wine: #35151f;
      --gold: #d5ad70;
      --text: #292322;
      --muted: #7d6b70;
      --border: #f3dada;
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100vh; margin: 0; font-family: "Cairo", "DM Sans", sans-serif; background: var(--pink-bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; }

    .app-container {
      display: flex;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      position: relative;
    }

    .app-overlay {
      position: absolute;
      inset: 0;
      background: rgba(53, 21, 31, 0.45);
      z-index: 1;
    }

    /* Sidebar */
    .sidebar {
      width: 140px;
      background: rgba(252, 238, 237, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 10px;
      z-index: 10;
      border-right: 1px solid rgba(255, 255, 255, 0.4);
    }

    .sidebar-logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      padding: 5px;
      background: #ffffff10;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      border-radius: 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      width: 100%;
      transition: all 0.2s ease;
    }

    .nav-item.active, .nav-item:hover {
      background: #f7dadd;
      color: var(--raspberry-dark);
    }

    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    .sidebar-footer {
      text-align: center;
      font-size: 10px;
      color: var(--raspberry-dark);
      font-weight: 700;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 30px 20px;
      z-index: 5;
      overflow-y: auto;
    }

    /* Card App Center */
    .auth-card {
      background: rgba(255, 245, 245, 0.96);
      backdrop-filter: blur(15px);
      width: min(480px, 95%);
      border-radius: 32px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .card-logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid var(--gold);
      padding: 5px;
      background: #ffffff10;
    }

    .auth-card h1 {
      color: var(--raspberry);
      font-size: 24px;
      margin: 10px 0;
      font-weight: 700;
    }

    .auth-card p.subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* Forms & Inputs */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--raspberry-dark);
      margin-bottom: 4px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      outline: none;
      background: #ffffff;
      font-size: 13px;
      color: var(--text);
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--raspberry);
      box-shadow: 0 0 0 3px rgba(184, 59, 99, 0.15);
    }

    .btn-action {
      width: 100%;
      padding: 13px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .btn-action:hover { transform: translateY(-1px); }
    .btn-raspberry { background: var(--raspberry); color: white; box-shadow: 0 4px 15px rgba(184, 59, 99, 0.3); }
    .btn-outline-raspberry { background: transparent; border: 1.5px solid var(--raspberry); color: var(--raspberry); }

    .status {
      margin-top: 15px;
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      display: none;
      line-height: 1.5;
    }
    .status.success { display: block; background: #e9f6ee; color: #1d6340; }
    .status.error { display: block; background: #fff0ed; color: #9a3024; }
    .status.info { display: block; background: #f7f0df; color: #75541f; }

    .hidden { display: none !important; }

    .profile-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
      text-align: left;
    }
    .profile-box h3 { color: var(--raspberry); margin: 0 0 8px; font-size: 18px; }
    .profile-box p { font-size: 13px; color: var(--muted); margin: 6px 0; }

    .offers-app-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
    }
    .offer-mini-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px;
    }
    .offer-mini-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; }
    .offer-mini-info h4 { margin: 0 0 4px; color: var(--wine); font-size: 15px; }
    .offer-mini-info p { margin: 0; font-size: 12px; color: var(--muted); }

    @media (max-width: 768px) {
      .app-container { flex-direction: column-reverse; }
      .sidebar {
        width: 100%;
        height: 70px;
        flex-direction: row;
        padding: 0 20px;
        position: fixed;
        bottom: 0;
        left: 0;
      }
      .sidebar-logo, .sidebar-footer { display: none; }
      .sidebar-nav { flex-direction: row; justify-content: space-around; gap: 0; }
      .main-content { padding-bottom: 90px; }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <div class="app-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="./logo.png" alt="Flamingo Resto Café">
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" id="navAuthBtn">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Compte</span>
        </button>
        <button type="button" class="nav-item" id="navResBtn">
          <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
          <span>Réserver</span>
        </button>
        <button type="button" class="nav-item" id="navOffersBtn">
          <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
          <span>Offres</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        Mahdia<br>Corniche 1
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="auth-card">
        <img src="./logo.png" alt="Flamingo Resto Café" class="card-logo">

        <!-- SECTION 1 : COMPTE & AUTH -->
        <div id="sectionAuth">
          <h1>عسلامة بيك في Flamingo ♡</h1>
          <p class="subtitle">ادخل لحسابك ولا اعمل حساب جديد باش تكتشف العروض وتحجز طاولتك.</p>

          <!-- Choix (Boutons principaux) -->
          <div id="authChoice">
            <button type="button" class="btn-action btn-raspberry" id="showLoginBtn">ندخل لحسابي ➔</button>
            <button type="button" class="btn-action btn-outline-raspberry" id="showSignupBtn">نعمل حساب جديد ➔</button>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="hidden">
            <div class="form-grid">
              <div class="field">
                <label>البريد الإلكتروني (Email)</label>
                <input id="loginEmail" type="email" required placeholder="vous@exemple.com">
              </div>
              <div class="field">
                <label>كلمة السر (Mot de passe)</label>
                <input id="loginPassword" type="password" required placeholder="••••••••">
              </div>
            </div>
            <button type="submit" class="btn-action btn-raspberry">تسجيل الدخول</button>
            <button type="button" class="btn-action btn-outline-raspberry backToChoice" style="margin-top:8px;">رجوع</button>
          </form>

          <!-- Signup Form -->
          <form id="signupForm" class="hidden">
            <div class="form-grid">
              <div class="field">
                <label>الاسم الكامل</label>
                <input id="signupName" type="text" required placeholder="اسمك ولقبك">
              </div>
              <div class="field">
                <label>رقم الهاتف</label>
                <input id="signupPhone" type="tel" required placeholder="رقم هاتفك">
              </div>
              <div class="field">
                <label>البريد الإلكتروني</label>
                <input id="signupEmail" type="email" required placeholder="vous@exemple.com">
              </div>
              <div class="field">
                <label>كلمة السر (6 أحرف على الأقل)</label>
                <input id="signupPassword" type="password" minlength="6" required placeholder="••••••••">
              </div>
            </div>
            <button type="submit" class="btn-action btn-raspberry">إنشاء الحساب</button>
            <button type="button" class="btn-action btn-outline-raspberry backToChoice" style="margin-top:8px;">رجوع</button>
          </form>

          <!-- Espace Client Connecté -->
          <div id="userProfile" class="hidden">
            <div class="profile-box">
              <h3 id="welcomeText">مرحبا بيك !</h3>
              <p id="userEmail"></p>
              <p id="userPhone"></p>
              <p id="userPoints" style="color:var(--gold); font-weight:bold; margin-top:10px;"></p>
            </div>
            <button type="button" class="btn-action btn-outline-raspberry" id="logoutBtn" style="margin-top: 15px;">تسجيل الخروج</button>
          </div>

          <div id="authStatus" class="status"></div>
        </div>

        <!-- SECTION 2 : RÉSERVATION -->
        <div id="sectionRes" class="hidden">
          <h1>حجز طاولة ♡</h1>
          <p class="subtitle">عمر المعطيات باش تبعث طلب الحجز بتاعك مباشرة.</p>

          <form id="reservationForm">
            <div class="form-grid">
              <div class="field">
                <label>الاسم الكامل</label>
                <input id="resName" type="text" required>
              </div>
              <div class="field">
                <label>رقم الهاتف</label>
                <input id="resPhone" type="tel" required>
              </div>
              <div class="field">
                <label>التاريخ</label>
                <input id="resDate" type="date" required>
              </div>
              <div class="field">
                <label>الوقت</label>
                <input id="resTime" type="time" required>
              </div>
              <div class="field">
                <label>عدد الأشخاص</label>
                <select id="resGuests">
                  <option value="1">1 شخص</option>
                  <option value="2" selected>2 أشخاص</option>
                  <option value="3">3 أشخاص</option>
                  <option value="4">4 أشخاص</option>
                  <option value="5">5 أشخاص</option>
                  <option value="6">6 أشخاص فما فوق</option>
                </select>
              </div>
              <div class="field">
                <label>ملاحظات (اختياري)</label>
                <textarea id="resNotes" placeholder="طلب خاص..."></textarea>
              </div>
            </div>
            <button type="submit" class="btn-action btn-raspberry">تأكيد طلب الحجز</button>
          </form>
          <div id="resStatus" class="status"></div>
        </div>

        <!-- SECTION 3 : OFFRES -->
        <div id="sectionOffers" class="hidden">
          <h1>عروض Flamingo</h1>
          <p class="subtitle">اكتشف آخر العروض والجديد متاعنا.</p>
          <div class="offers-app-grid" id="offersGrid">
            <p style="color: var(--muted); text-align: center;">جاري تحميل العروض...</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://dnbcanwxikpysscslotn.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7jY0-exkRXZ4SqdFrSxPnQ_86QgmRfT';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const $ = (id) => document.getElementById(id);

    function showStatus(el, msg, type) {
      if (!el) return;
      el.textContent = msg;
      el.className = `status ${type}`;
    }

    // Navigation Sidebar
    const switchSection = (activeSec, activeBtn) => {
      $('sectionAuth').classList.add('hidden');
      $('sectionRes').classList.add('hidden');$('sectionOffers').classList.add('hidden');
      activeSec.classList.remove('hidden');

      $('navAuthBtn').classList.remove('active');
      $('navResBtn').classList.remove('active');$('navOffersBtn').classList.remove('active');
      activeBtn.classList.add('active');
    };

    $('navAuthBtn').addEventListener('click', () => switchSection($('sectionAuth'), $('navAuthBtn')));$('navResBtn').addEventListener('click', () => {
      switchSection($('sectionRes'),$('navResBtn'));
      fillReservationDefaults();
    });
    $('navOffersBtn').addEventListener('click', () => {
      switchSection($('sectionOffers'),$('navOffersBtn'));
      loadOffers();
    });

    // Bascule explicite et directe vers les formulaires de connexion / inscription
    $('showLoginBtn').addEventListener('click', () => {$('authChoice').classList.add('hidden');
      $('loginForm').classList.remove('hidden');$('signupForm').classList.add('hidden');
      if($('authStatus'))$('authStatus').className = 'status';
    });

    $('showSignupBtn').addEventListener('click', () => {$('authChoice').classList.add('hidden');
      $('signupForm').classList.remove('hidden');$('loginForm').classList.add('hidden');
      if($('authStatus'))$('authStatus').className = 'status';
    });

    document.querySelectorAll('.backToChoice').forEach(btn => {
      btn.addEventListener('click', () => {
        $('loginForm').classList.add('hidden');
        $('signupForm').classList.add('hidden');$('authChoice').classList.remove('hidden');
        if($('authStatus'))$('authStatus').className = 'status';
      });
    });

    // Connexion Supabase
    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showStatus($('authStatus'), 'جاري تسجيل الدخول...', 'info');

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: $('loginEmail').value.trim(),
          password: $('loginPassword').value
        });

        if (error) {
          showStatus($('authStatus'), 'البريد أو كلمة السر خاطئة', 'error');
        } else {
          showStatus($('authStatus'), 'تم تسجيل الدخول بنجاح!', 'success');
          await checkUserSession();
        }
      } catch (err) {
        showStatus($('authStatus'), 'حدث خطأ في الاتصال بقاعدة البيانات', 'error');
      }
    });

    // Inscription Supabase
    $('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showStatus($('authStatus'), 'جاري إنشاء الحساب...', 'info');

      try {
        const { error } = await supabase.auth.signUp({
          email: $('signupEmail').value.trim(),
          password: $('signupPassword').value,
          options: {
            data: {
              full_name: $('signupName').value.trim(),
              phone: $('signupPhone').value.trim()
            }
          }
        });

        if (error) {
          showStatus($('authStatus'), error.message, 'error');
        } else {
          showStatus($('authStatus'), 'تم إنشاء الحساب بنجاح!', 'success');
          await checkUserSession();
        }
      } catch (err) {
        showStatus($('authStatus'), 'حدث خطأ في الاتصال بقاعدة البيانات', 'error');
      }
    });

    // Déconnexion
    $('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      await checkUserSession();
      showStatus($('authStatus'), 'تم تسجيل الخروج.', 'info');
    });

    // Réservation
    $('reservationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        showStatus($('resStatus'), 'يجب عليك تسجيل الدخول أولاً للقيام بالحجز', 'error');
        return;
      }

      showStatus($('resStatus'), 'جاري إرسال طلب الحجز...', 'info');

      const { error } = await supabase.from('reservations').insert([{
        user_id: user.id,
        full_name: $('resName').value.trim(),
        phone: $('resPhone').value.trim(),
        reservation_date: $('resDate').value,
        reservation_time: $('resTime').value,
        guests: parseInt($('resGuests').value, 10),
        notes: $('resNotes').value.trim(),
        status: 'pending'
      }]);

      if (error) {
        showStatus($('resStatus'), error.message, 'error');
      } else {
        showStatus($('resStatus'), 'تم إرسال طلب الحجز بنجاح! سنتصل بك للتأكيد.', 'success');
        $('resNotes').value = '';
      }
    });

    let currentProfile = null;
    let currentUser = null;

    async function checkUserSession() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        currentUser = user;

        if (user) {
          const { data: profile } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .maybeSingle();

          currentProfile = profile;

          $('authChoice').classList.add('hidden');$('loginForm').classList.add('hidden');
          $('signupForm').classList.add('hidden');$('userProfile').classList.remove('hidden');

          const name = profile?.full_name || user.user_metadata?.full_name || 'Client';
          const phone = profile?.phone || user.user_metadata?.phone || '—';
          const points = profile?.loyalty_points ?? 0;

          $('welcomeText').textContent = `مرحبا بيك، ${name} ♡`;
          $('userEmail').textContent = `البريد: ${user.email}`;
          $('userPhone').textContent = `الهاتف: ${phone}`;
          $('userPoints').textContent = `✨ نقاط الوفاء: ${points} نقطة`;
        } else {
          $('userProfile').classList.add('hidden');$('authChoice').classList.remove('hidden');
          $('loginForm').classList.add('hidden');$('signupForm').classList.add('hidden');
        }
      } catch(e) {
        console.error(e);
      }
    }

    function fillReservationDefaults() {
      if (currentProfile || currentUser) {
        $('resName').value = currentProfile?.full_name \vert{}\vert{} currentUser?.user_metadata?.full_name \vert{}\vert{} '';$('resPhone').value = currentProfile?.phone || currentUser?.user_metadata?.phone || '';
      }
    }

    async function loadOffers() {
      const grid = $('offersGrid');
      grid.replaceChildren();

      const { data, error } = await supabase
        .from('offers')
        .select('*')
        .eq('active', true)
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        grid.innerHTML = '<p style="color:var(--muted); text-align:center;">لا توجد عروض حالياً، تابعنا قريباً!</p>';
        return;
      }

      data.forEach(offer => {
        const item = document.createElement('div');
        item.className = 'offer-mini-card';
        item.innerHTML = `
          <img src="${offer.image_url || 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=300&q=80'}" alt="Offre">
          <div class="offer-mini-info">
            <h4>${offer.title}</h4>
            <p>${offer.description || ''}</p>
            ${offer.validity ? `<small style="color:var(--raspberry);">صالحة إلى: ${offer.validity}</small>` : ''}
          </div>
        `;
        grid.appendChild(item);
      });
    }

    checkUserSession();
  </script>
</body>
</html>

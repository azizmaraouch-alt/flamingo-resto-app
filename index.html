<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a86d60">
  <meta name="description" content="Flamingo Resto Café - Mahdia Corniche 1 - Application Officielle">
  <title>Flamingo Resto Café - Mahdia</title>

  <!-- Google Fonts & Supabase SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --terracotta: #a86d60;
      --terracotta-dark: #8c5246;
      --terracotta-light: #f6eeec;
      --gold: #d5ad70;
      --gold-dark: #b88d4d;
      --wine: #35151f;
      --cream: #faf5ed;
      --card-bg: #ffffff;
      --text: #2a2022;
      --muted: #7e6f73;
      --border: #ebdcd8;
      --radius: 22px;
      --shadow: 0 12px 32px rgba(168, 109, 96, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; font-family: "Cairo", sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; outline: none; }

    .app-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 80% 20%, rgba(213, 173, 112, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(168, 109, 96, 0.12) 0%, transparent 50%);
      z-index: -1;
    }

    .hidden { display: none !important; }

    /* 1. AUTH SCREEN */
    .auth-overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 100;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      width: min(440px, 100%);
      border-radius: 32px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(53, 21, 31, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: fadeIn 0.4s ease-out;
    }

    .card-logo-wrap {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--terracotta);
      border: 3px solid var(--gold);
      box-shadow: 0 10px 25px rgba(168, 109, 96, 0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .auth-card h1 { color: var(--wine); font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .auth-card p.tagline { color: var(--terracotta); font-size: 14px; font-weight: 700; margin-bottom: 24px; }

    .auth-tabs { display: flex; background: var(--terracotta-light); padding: 5px; border-radius: 18px; margin-bottom: 22px; }
    .auth-tab-btn { flex: 1; padding: 10px; border-radius: 14px; font-size: 14px; font-weight: 800; color: var(--muted); background: transparent; transition: all 0.25s ease; }
    .auth-tab-btn.active { background: var(--terracotta); color: white; box-shadow: 0 4px 14px rgba(168, 109, 96, 0.3); }

    .form-grid { display: flex; flex-direction: column; gap: 14px; text-align: right; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 800; color: var(--wine); }
    .field input, .field select, .field textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 16px; padding: 12px 16px; background: #ffffff; font-size: 14px; color: var(--text); transition: all 0.2s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--terracotta); box-shadow: 0 0 0 4px rgba(168, 109, 96, 0.15); outline: none; }

    .btn-primary {
      width: 100%; padding: 14px; border-radius: 18px; font-size: 15px; font-weight: 800; background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%); color: white; margin-top: 10px; box-shadow: 0 8px 22px rgba(168, 109, 96, 0.35); transition: all 0.2s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(168, 109, 96, 0.45); }

    .status-alert { padding: 12px 16px; border-radius: 14px; font-size: 13px; font-weight: 700; margin-top: 14px; display: none; text-align: center; }
    .status-alert.success { display: block; background: #e8f7ed; color: #1e7e43; border: 1px solid #b8ebca; }
    .status-alert.error { display: block; background: #fde8e8; color: #b91c1c; border: 1px solid #f8b4b4; }
    .status-alert.info { display: block; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  </style>
</head>

<body>
  <div class="app-bg"></div>

  <!-- AUTH GATEWAY -->
  <div id="authGateway" class="auth-overlay">
    <div class="auth-card">
      <div class="card-logo-wrap">
        <img src="logo.png" id="appLogoImg" alt="Flamingo Logo">
      </div>
      <h1>Flamingo Resto Café</h1>
      <p class="tagline">♡ أهلاً بيك</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthMode('login')">تسجيل الدخول</button>
      </div>

      <form id="loginForm" class="form-grid" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="loginEmail">البريد الإلكتروني (Email)</label>
          <input type="email" id="loginEmail" required placeholder="exemple@mail.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="loginPassword">كلمة السر (Mot de passe)</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">دخول لحسابي ➔</button>
      </form>

      <div id="authStatus" class="status-alert" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dnbcanwxikpysscslotn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7jY0-exkRXZ4SqdFrSxPnQ_86QgmRfT';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);

    function showStatus(el, msg, type) {
      if (!el) return;
      el.textContent = msg;
      el.className = `status-alert ${type}`;
    }

    // 🚀 التحقق الفوري المباشر من الإيميل وتوجيهه للأمين
    async function checkAdminAndRedirect(user) {
      if (!user) return false;
      
      if (user.email && user.email.trim().toLowerCase() === 'azizmaraouch@gmail.com') {
        window.location.href = 'admin.html';
        return true;
      }
      return false;
    }

    window.handleLogin = async function(e) {
      e.preventDefault();
      const emailInput = $('loginEmail').value.trim();

      // التحقق السريع قبل إرسال الطلب
      if (emailInput.toLowerCase() === 'azizmaraouch@gmail.com') {
        showStatus($('authStatus'), 'مرحباً بك يا مدير، جاري توجيهك للوحة التحكم...', 'success');
      } else {
        showStatus($('authStatus'), 'جاري تسجيل الدخول...', 'info');
      }

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({
          email: emailInput,
          password: $('loginPassword').value
        });

        if (error) {
          showStatus($('authStatus'), 'البريد أو كلمة السر غير صحيحة', 'error');
        } else {
          // التحقق والتوجيه الفوري
          const isAdmin = await checkAdminAndRedirect(data.user);
          if (!isAdmin) {
            window.location.href = 'index.html'; // أو البقاء في واجهة العميل العادية
          }
        }
      } catch (err) {
        showStatus($('authStatus'), 'خطأ في الاتصال بقاعدة البيانات', 'error');
      }
    };

    // التحقق التلقائي إذا كان الجلسة مفتوحة مسبقاً
    async function initSession() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
        await checkAdminAndRedirect(user);
      }
    }

    initSession();
  </script>
</body>
</html>
